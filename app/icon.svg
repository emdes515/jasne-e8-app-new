<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131E36" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>
    <radialGradient id="iconHalo" cx="50%" cy="44%" r="44%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.24" />
      <stop offset="65%" stop-color="#FFB800" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#FFB800" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="iconBulb" cx="38%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="28%" stop-color="#FEF08A" />
      <stop offset="64%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="iconBase" x1="23" y1="44" x2="41" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="30%" stop-color="#64748B" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Tactile Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#iconBg)" stroke="#FFB800" stroke-opacity="0.55" stroke-width="2.5" />

  <!-- Subtle static radial glow behind bulb -->
  <circle cx="32" cy="29" r="21" fill="url(#iconHalo)" />

  <!-- 5 geometric light rays -->
  <g stroke="#FFC933" stroke-width="2.6" stroke-linecap="round">
    <line x1="32" y1="7" x2="32" y2="11.2" />
    <line x1="15.2" y1="13" x2="18.3" y2="16.1" />
    <line x1="48.8" y1="13" x2="45.7" y2="16.1" />
    <line x1="9.2" y1="27.5" x2="13.4" y2="28" />
    <line x1="54.8" y1="27.5" x2="50.6" y2="28" />
  </g>

  <!-- 3D Glass Bulb Body -->
  <path
    d="M32 14.5 C23.6 14.5 17.4 20.6 17.4 28.7 C17.4 34.0 20.2 37.6 22.7 40.4 C23.9 41.7 24.6 43.3 24.7 45.2 L39.3 45.2 C39.4 43.3 40.1 41.7 41.3 40.4 C43.8 37.6 46.6 34.0 46.6 28.7 C46.6 20.6 40.4 14.5 32 14.5 Z"
    fill="url(#iconBulb)"
    stroke="#92400E"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Inner rim-depth shading -->
  <path
    d="M20.8 33.8 C22.3 37.4 24.4 39.8 25.5 43.0"
    stroke="#B45309"
    stroke-opacity="0.3"
    stroke-width="1.8"
    stroke-linecap="round"
  />
  <path
    d="M43.2 33.8 C41.7 37.4 39.6 39.8 38.5 43.0"
    stroke="#B45309"
    stroke-opacity="0.3"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Specular 3D Highlight -->
  <path
    d="M21.8 26.3 C22.3 21.5 25.4 18.4 29.5 17.6"
    stroke="#FFFFFF"
    stroke-opacity="0.85"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <circle cx="32.6" cy="17.5" r="1.2" fill="#FFFFFF" fill-opacity="0.75" />

  <!-- Filament posts & spark -->
  <path
    d="M28.8 44.5 V33.8 C28.8 31.8 30.5 31.8 32 34.2 C33.5 31.8 35.2 31.8 35.2 33.8 V44.5"
    stroke="#92400E"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M28.8 33.8 C28.8 31.8 30.5 31.8 32 34.2 C33.5 31.8 35.2 31.8 35.2 33.8"
    stroke="#FFFBEB"
    stroke-width="2.1"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M32 23 L33.1 25.8 L35.9 26.9 L33.1 28 L32 30.8 L30.9 28 L28.1 26.9 L30.9 25.8 Z"
    fill="#FFFBEB"
  />

  <!-- Tactile 3D Metallic Screw Base -->
  <rect x="23.9" y="44.8" width="16.2" height="4.1" rx="2.05" fill="url(#iconBase)" stroke="#0F172A" stroke-width="1.8" />
  <rect x="25.2" y="49.3" width="13.6" height="3.8" rx="1.9" fill="url(#iconBase)" stroke="#0F172A" stroke-width="1.8" />
  <path d="M28.2 53.3 H35.8 C35.5 55.6 34.0 56.9 32 56.9 C30.0 56.9 28.5 55.6 28.2 53.3 Z" fill="#1E293B" stroke="#0F172A" stroke-width="1.8" />
  <rect x="25.4" y="45.8" width="3.8" height="1.4" rx="0.7" fill="#CBD5E1" fill-opacity="0.68" />
  <rect x="26.5" y="50.2" width="3.2" height="1.3" rx="0.65" fill="#CBD5E1" fill-opacity="0.58" />
</svg>
